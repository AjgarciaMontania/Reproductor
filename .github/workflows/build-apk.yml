name: Compilar APK

# Se ejecuta al subir cambios y tambien a mano desde la pestaña Actions.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar el SDK de Android
        uses: android-actions/setup-android@v3

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de depuracion (instalable)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MiReproductorTV-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90
