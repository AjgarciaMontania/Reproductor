name: Compilar APK de prueba (sin firmar con tu llave)

# SOLO manual, a proposito.
#
# Este flujo produce un APK firmado con la llave de DEPURACION, util para
# comprobar que el codigo compila, pero que NO sirve como actualizacion:
# al tener otra firma, Android lo rechaza sobre la app instalada
# ("signatures do not match").
#
# Antes se ejecutaba en cada push y su artefacto se confundia con el bueno.
# El APK que hay que instalar es el de la pestaña Releases, que publica
# el flujo "Publicar version".
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar el SDK de Android
        uses: android-actions/setup-android@v3

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de depuracion (instalable)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MiReproductorTV-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90
